name: Build Debug APK

# Compila un APK de depuración para pruebas locales. No necesita claves de firma.
# Se ejecuta a mano (Actions > Build Debug APK > Run workflow) o al subir cambios
# a ramas claude/**.
on:
  workflow_dispatch:
  push:
    branches: [ "claude/**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleGenericDebug --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: seal-debug-apk
          path: app/build/outputs/apk/generic/debug/*.apk
          if-no-files-found: error
