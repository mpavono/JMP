name: Build Debug APK

# Compila un APK de depuración para pruebas locales. No necesita claves de firma.
# Se ejecuta a mano (Actions > Build Debug APK > Run workflow) o al subir cambios
# a ramas claude/**.
on:
  workflow_dispatch:
  push:
    branches: [ "claude/**" ]

jobs:
  build:
    # Versión fija de la imagen. Esta imagen ya trae el Android SDK instalado.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # android-actions/setup-android fallaba aquí y no hace falta: el SDK viene
      # preinstalado en la imagen. Este paso solo lo muestra para diagnóstico.
      - name: Show preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        # -PnoSplits: un solo APK, solo arm64-v8a (ABI_FILTERS en gradle.properties)
        run: ./gradlew assembleGenericDebug -PnoSplits --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: jmp-debug-apk
          path: app/build/outputs/apk/generic/debug/*.apk
          if-no-files-found: error
